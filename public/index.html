<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SKILSETING — correctly incorrect</title>
<style>
:root {
  --paper: #ece9df;
  --ink: #151515;
  --faint: #aaa69b;
  --wrong: #ff3b30;
  --acid: #d7ff38;
}
* { box-sizing: border-box; }
html { background: var(--paper); }
body {
  margin: 0;
  color: var(--ink);
  background:
    linear-gradient(90deg, transparent 39px, rgba(255,59,48,.2) 40px, transparent 41px),
    repeating-linear-gradient(0deg, transparent 0 31px, rgba(21,21,21,.08) 31px 32px),
    var(--paper);
  font-family: "Courier New", Courier, monospace;
}
body.locked { overflow: hidden; }
#entrance {
  position: fixed;
  inset: 0;
  z-index: 20;
  display: grid;
  place-items: center;
  padding: 30px;
  background:
    linear-gradient(90deg, transparent 39px, rgba(255,59,48,.2) 40px, transparent 41px),
    repeating-linear-gradient(0deg, transparent 0 31px, rgba(21,21,21,.08) 31px 32px),
    var(--paper);
  transition: opacity .45s ease, visibility .45s;
}
#entrance.gone {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}
#enter {
  appearance: none;
  border: 0;
  padding: 0;
  color: var(--ink);
  background: transparent;
  font: 900 clamp(30px, 7vw, 86px)/.9 "Courier New", Courier, monospace;
  letter-spacing: -.065em;
  cursor: pointer;
}
#enter::after {
  content: "";
  display: block;
  border-bottom: .09em wavy var(--wrong);
  transform: translateY(.12em);
}
#enter:hover, #enter:focus-visible {
  color: var(--wrong);
  outline: 0;
}
#entrance small {
  position: absolute;
  bottom: 18px;
  font-size: 9px;
  text-transform: uppercase;
}
header {
  position: sticky;
  top: 0;
  z-index: 3;
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 18px;
  align-items: end;
  padding: 18px 22px 16px 55px;
  border-bottom: 2px solid var(--ink);
  background: rgba(236,233,223,.94);
  backdrop-filter: blur(8px);
}
h1 {
  margin: 0;
  font-size: clamp(30px, 8vw, 92px);
  line-height: .78;
  letter-spacing: -.09em;
}
.meta {
  max-width: 260px;
  font-size: 10px;
  line-height: 1.4;
  text-align: right;
  text-transform: uppercase;
}
#stream {
  min-height: 100vh;
  padding: 34px 22px 20vh 55px;
}
.entry {
  display: grid;
  grid-template-columns: minmax(56px, 8vw) 1fr auto;
  gap: 18px;
  align-items: baseline;
  min-height: 64px;
  padding: 10px 0;
  border-bottom: 1px dashed var(--faint);
}
.number, .verdict {
  color: #6f6c64;
  font-size: 10px;
  text-transform: uppercase;
}
.word {
  overflow-wrap: anywhere;
  font-weight: 900;
  font-size: clamp(24px, 6vw, 76px);
  line-height: .9;
  letter-spacing: -.055em;
  cursor: pointer;
  transition: color .12s, transform .12s;
}
.word:hover, .word:focus {
  color: var(--wrong);
  transform: translateX(5px);
  outline: 0;
}
.word::after {
  content: "";
  display: block;
  width: min(100%, 9em);
  border-bottom: .09em wavy var(--wrong);
  transform: translateY(.08em);
}
.verdict {
  padding: 3px 5px;
  color: var(--ink);
  background: var(--acid);
  white-space: nowrap;
}
#sentinel { height: 1px; }
footer {
  position: fixed;
  right: 12px;
  bottom: 10px;
  z-index: 4;
  padding: 5px 7px;
  border: 1px solid var(--ink);
  background: var(--acid);
  font-size: 9px;
  text-transform: uppercase;
}
@media (max-width: 620px) {
  header { padding-left: 30px; }
  .meta { display: none; }
  #stream { padding-left: 30px; padding-right: 12px; }
  .entry { grid-template-columns: 38px 1fr; gap: 8px; }
  .verdict { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  #entrance, .word { transition: none; }
}
</style>
</head>
<body class="locked">
<div id="entrance">
  <button id="enter" type="button">BE SHURE TO ENTER</button>
  <small>sound is requiered</small>
</div>

<header>
  <h1>SKILSETING</h1>
  <div class="meta">A perpetually unfinished index of letters placed near their intended locations.</div>
</header>

<main id="stream" aria-live="polite"></main>
<div id="sentinel" aria-hidden="true"></div>
<footer><span id="count">0</span> erors and coutning</footer>

<script>
const roots = [
  "SKILSET", "SKILSETING", "SKILLSET", "SKILSETTING", "SKILLZET",
  "SKILZETING", "SKILLSETHING", "SKILLEDSETTING", "SKILLSHET",
  "SKILSITING", "SKILLSETTIGN", "SKILESTING", "SKILLSEETING"
];
const verdicts = [
  "definately", "aproved", "currect", "verifried", "offical",
  "standerd", "succes", "acurate", "compleat", "intensional"
];
const stream = document.querySelector("#stream");
const count = document.querySelector("#count");
const entrance = document.querySelector("#entrance");
const enterButton = document.querySelector("#enter");
let total = 0;
let entered = false;
let lastGesture = 0;

const layers = ["a", "b", "c"].map((bank, index) => ({
  bank,
  audio: new Audio(),
  lastSample: 0,
  volume: [0.46, 0.42, 0.38][index]
}));

layers.forEach(layer => {
  layer.audio.preload = "metadata";
  layer.audio.volume = layer.volume;
});

function randomSample(layer) {
  let sample;
  do {
    sample = 1 + Math.floor(Math.random() * 5);
  } while (sample === layer.lastSample);
  layer.lastSample = sample;
  return `mp3/skil_${layer.bank}-${sample}.mp3`;
}

function triggerLayer() {
  if (!entered) return;

  const layer = layers.find(item => item.audio.paused || item.audio.ended);
  if (!layer) return;

  layer.audio.src = randomSample(layer);
  layer.audio.currentTime = 0;
  layer.audio.play().catch(error => {
    console.warn("Audio stayed incorrectly quiet:", error);
  });
}

function enter(event) {
  event.stopPropagation();
  entered = true;
  document.body.classList.remove("locked");
  entrance.classList.add("gone");
  triggerLayer();
}

enterButton.addEventListener("click", enter);

document.addEventListener("pointerdown", event => {
  if (!entered || event.target === enterButton) return;
  triggerLayer();
}, { passive: true });

document.addEventListener("wheel", () => {
  if (!entered) return;
  const now = Date.now();
  if (now - lastGesture < 900) return;
  lastGesture = now;
  triggerLayer();
}, { passive: true });

function mutate(source) {
  let s = source;
  const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
  const operation = Math.floor(Math.random() * 5);
  const at = Math.floor(Math.random() * (s.length + 1));

  if (operation === 0 && s.length > 4) s = s.slice(0, at) + s.slice(at + 1);
  if (operation === 1) s = s.slice(0, at) + letters[Math.floor(Math.random() * letters.length)] + s.slice(at);
  if (operation === 2 && at < s.length - 1) s = s.slice(0, at) + s[at + 1] + s[at] + s.slice(at + 2);
  if (operation === 3 && at < s.length) s = s.slice(0, at) + s[at] + s.slice(at);
  if (operation === 4) s += ["ING", "ED", "NESS", "LY"][Math.floor(Math.random() * 4)];

  return s || "SKILSET";
}

function addBatch(size = 18) {
  for (let i = 0; i < size; i++) {
    const seed = roots[(total + i) % roots.length];
    const mutations = 1 + Math.floor((total + i) / 20) % 5;
    let word = seed;
    for (let j = 0; j < mutations; j++) word = mutate(word);

    total += 1;
    const row = document.createElement("section");
    row.className = "entry";
    row.innerHTML = `
      <span class="number">${String(total).padStart(5, "0")}</span>
      <span class="word" role="button" tabindex="0" title="Click to make worse"></span>
      <span class="verdict">${verdicts[total % verdicts.length]}</span>`;

    const wordEl = row.querySelector(".word");
    wordEl.textContent = word;

    const worsen = () => {
      wordEl.textContent = mutate(mutate(wordEl.textContent));
      total += 1;
      count.textContent = total;
    };

    wordEl.addEventListener("click", worsen);
    wordEl.addEventListener("keydown", event => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        worsen();
        triggerLayer();
      }
    });

    stream.appendChild(row);
  }
  count.textContent = total;
}

addBatch(24);
const observer = new IntersectionObserver(entries => {
  if (entries[0].isIntersecting) addBatch();
}, { rootMargin: "800px" });
observer.observe(document.querySelector("#sentinel"));
</script>
</body>
</html>
