<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FCM Practice 01</title>
</head>
<body>

  <button id="enable">Connect browser to Firebase</button>
  <p id="status">Not connected yet.</p>
  <pre id="output"></pre>

  <script type="module">
    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

    import {
      getMessaging,
      getToken,
      isSupported,
      onMessage
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-messaging.js";
    async function inspectPushEnvironment() {
      const registration =
        "serviceWorker" in navigator
          ? await navigator.serviceWorker.register("/firebase-messaging-sw.js")
          : null;

      const report = {
        url: location.href,
        secureContext: window.isSecureContext,
        standalone:
          window.matchMedia("(display-mode: standalone)").matches ||
          navigator.standalone === true,
        notifications: "Notification" in window,
        permission:
          "Notification" in window ? Notification.permission : "unavailable",
        serviceWorker: "serviceWorker" in navigator,
        pushManagerOnWindow: "PushManager" in window,
        pushManagerOnRegistration: Boolean(registration?.pushManager),
        showNotification: Boolean(registration?.showNotification)
      };

      console.table(report);
      document.querySelector("#status").textContent =
        report.pushManagerOnRegistration
          ? "Push environment ready. Firebase may request a token."
          : report.standalone
            ? "Installed app, but Push API is unavailable here."
            : "Push API unavailable. On iPhone/iPad, install this page to the Home Screen.";

      return report.pushManagerOnRegistration;
    }

    const firebaseConfig = {
      apiKey: "AIzaSyBCD7hYTGcuwd-d9t8eCfwvNcGFbbwbg5A",
      authDomain: "skilseting.firebaseapp.com",
      projectId: "skilseting",
      storageBucket: "skilseting.firebasestorage.app",
      messagingSenderId: "323745949558",
      appId: "1:323745949558:web:bfda4c5b62d79d7dde7c57"
    };

    const vapidKey =
      "BHE1a4Z4oaeGA0h2oU4JKLYwPwcJIK7cOfgGH3wBQCg4UnTRgJq3ellzLZ0DTMns8liEbb7EMhkr-wK-anA-q0o";

    const app = initializeApp(firebaseConfig);

    const button = document.querySelector("#enable");
    const status = document.querySelector("#status");
    const output = document.querySelector("#output");

    let messaging = null;
    let foregroundListenerStarted = false;

    function getBrowserChecks() {
      return {
        url: location.href,
        secureContext: window.isSecureContext,
        notification: "Notification" in window,
        notificationPermission:
          "Notification" in window
            ? Notification.permission
            : "unavailable",
        serviceWorker: "serviceWorker" in navigator,
        serviceWorkerRegistration:
          "ServiceWorkerRegistration" in window,
        showNotification:
          "ServiceWorkerRegistration" in window &&
          "showNotification" in ServiceWorkerRegistration.prototype,
        pushManager: "PushManager" in window,
        pushSubscription: "PushSubscription" in window,
        pushSubscriptionGetKey:
          "PushSubscription" in window &&
          "getKey" in PushSubscription.prototype,
        indexedDB: "indexedDB" in window,
        cookiesEnabled: navigator.cookieEnabled
      };
    }

    function startForegroundListener() {
      if (foregroundListenerStarted) {
        return;
      }

      onMessage(messaging, (payload) => {
        status.textContent =
          "FCM message received while the page was open.";

        output.textContent =
          JSON.stringify(payload, null, 2);

        const title =
          payload.notification?.title || "SKILSET";

        const body =
          payload.notification?.body ||
          "Remote Firebase message received.";

        new Notification(title, {
          body: body
        });
      });

      foregroundListenerStarted = true;
    }

    button.addEventListener("click", async () => {
      try {
        status.textContent = "Checking browser support...";

        const checks = getBrowserChecks();

        output.textContent =
          JSON.stringify(checks, null, 2);

        const pushReady = await inspectPushEnvironment();

        if (!pushReady) {
          return;
        }

        const supported = await isSupported();

        if (!supported) {
          status.textContent =
            "FCM is not supported by this browser environment.";
          return;
        }

        const permission =
          await Notification.requestPermission();

        if (permission !== "granted") {
          status.textContent =
            `Notification permission: ${permission}`;
          return;
        }

        status.textContent =
          "Requesting an address from Firebase...";

        if (!messaging) {
          messaging = getMessaging(app);
        }

        startForegroundListener();

        const token = await getToken(messaging, {
          vapidKey: vapidKey
        });

        if (token) {
          status.textContent =
            "FCM token acquired. Esteban remotely addressable.";
          output.textContent = token;
        } else {
          status.textContent =
            "Firebase returned no registration token.";
        }
      } catch (error) {
        console.error(error);

        status.textContent =
          "Something broke. Check the error below.";

        output.textContent =
          `${error.name}\n${error.message}`;
      }
    });
  </script>

</body>
</html>
