<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FCM Practice 01</title>
</head>
<body>

  <button id="enable">Connect Safari to Firebase</button>
  <p id="status">Not connected yet.</p>
  <pre id="token"></pre>

  <script type="module">
    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

    import {
      getMessaging,
      getToken,
      isSupported
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-messaging.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBCD7hYTGcuwd-d9t8eCfwvNcGFbbwbg5A",
      authDomain: "skilseting.firebaseapp.com",
      projectId: "skilseting",
      storageBucket: "skilseting.firebasestorage.app",
      messagingSenderId: "323745949558",
      appId: "1:323745949558:web:bfda4c5b62d79d7dde7c57"
    };

    const vapidKey =
      "BHE1a4Z4oaeGA0h2oU4JKLYwPwcJIK7cOfgGH3wBQCg4UnTRgJq3ellzLZ0DTMns8liEbb7EMhkr-wK-anA-q0o";

    const app = initializeApp(firebaseConfig);

    const button = document.querySelector("#enable");
    const status = document.querySelector("#status");
    const tokenDisplay = document.querySelector("#token");

    button.addEventListener("click", async () => {
      try {
        status.textContent = "Checking browser support...";

        if (!(await isSupported())) {
          status.textContent = "FCM is not supported by this browser.";
          return;
        }
    const checks = {
      url: location.href,
      secureContext: window.isSecureContext,
      serviceWorker: "serviceWorker" in navigator,
      pushManager: "PushManager" in window,
      notification: "Notification" in window,
      indexedDB: "indexedDB" in window
    };

    tokenDisplay.textContent =
      JSON.stringify(checks, null, 2);
        const permission = await Notification.requestPermission();

        if (permission !== "granted") {
          status.textContent = `Permission: ${permission}`;
          return;
        }

        status.textContent = "Requesting an address from Firebase...";

        const messaging = getMessaging(app);

        const token = await getToken(messaging, {
          vapidKey: vapidKey
        });

        if (token) {
          status.textContent = "FCM token acquired. Esteban remotely addressable.";
          tokenDisplay.textContent = token;
        } else {
          status.textContent = "Firebase returned no token.";
        }
      } catch (error) {
        status.textContent = "Something broke. Check the error below.";
        tokenDisplay.textContent = error.message;
        console.error(error);
      }
    });
  </script>

</body>
</html>
