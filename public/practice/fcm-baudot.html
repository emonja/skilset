<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090909">

  <title>FCM Baudot Receiver</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;

      background: #090909;
      color: #e7e2d6;

      font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        Monaco,
        Consolas,
        monospace;
    }

    main {
      width: min(100%, 520px);
    }

    h1 {
      margin: 0 0 32px;
      font-size: 14px;
      font-weight: normal;
      letter-spacing: 0.18em;
    }

    #signal {
      min-height: 160px;
      padding: 24px;
      display: grid;
      place-items: center;

      border: 1px solid #555;
      overflow-wrap: anywhere;

      font-size: clamp(24px, 8vw, 48px);
      line-height: 1.15;
      text-align: center;
    }

    button {
      width: 100%;
      margin-top: 18px;
      padding: 16px;

      border: 1px solid #e7e2d6;
      border-radius: 0;

      background: transparent;
      color: inherit;

      font: inherit;
      cursor: pointer;
    }

    #status {
      min-height: 20px;
      margin-top: 18px;

      color: #969186;
      font-size: 12px;
      line-height: 1.5;
    }

    #token {
      max-height: 100px;
      overflow: auto;

      color: #69665f;
      font-size: 9px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>
  <main>
    <h1>FCM / BAUDOT RECEIVER</h1>

    <div id="signal">NO SIGNAL</div>

    <button id="connect">CONNECT RECEIVER</button>

    <p id="status">
      Receiver disconnected.
    </p>

    <pre id="token"></pre>
  </main>

  <script type="module">
    import {
      initializeApp
    } from
      "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

    import {
      getMessaging,
      getToken,
      isSupported,
      onMessage
    } from
      "https://www.gstatic.com/firebasejs/12.18.0/firebase-messaging.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBCD7hYTGcuwd-d9t8eCfwvNcGFbbwbg5A",
      authDomain: "skilseting.firebaseapp.com",
      projectId: "skilseting",
      storageBucket: "skilseting.firebasestorage.app",
      messagingSenderId: "323745949558",
      appId: "1:323745949558:web:bfda4c5b62d79d7dde7c57"
    };

    const vapidKey =
      "BHE1a4Z4oaeGA0h2oU4JKLYwPwcJIK7cOfgGH3wBQCg4UnTRgJq3ellzLZ0DTMns8liEbb7EMhkr-wK-anA-q0o";

    const app = initializeApp(firebaseConfig);

    const signal = document.querySelector("#signal");
    const connect = document.querySelector("#connect");
    const status = document.querySelector("#status");
    const tokenOutput = document.querySelector("#token");

    let messaging;

    function displaySignal(text) {
      signal.textContent = text || "EMPTY SIGNAL";
      document.title = text
        ? `${text} / FCM Baudot`
        : "FCM Baudot Receiver";
    }

    /*
      When a notification opens this page with:

      ?signal=HELLO%20ESTEBAN

      display the signal immediately.
    */

    const parameters =
      new URLSearchParams(window.location.search);

    const incomingSignal =
      parameters.get("signal");

    if (incomingSignal) {
      displaySignal(incomingSignal);
      status.textContent =
        "Signal recovered from notification link.";
    }

    connect.addEventListener("click", async () => {
      try {
        status.textContent =
          "Checking receiver environment...";

        if (!(await isSupported())) {
          throw new Error(
            "Firebase Messaging is unavailable here."
          );
        }

        const permission =
          await Notification.requestPermission();

        if (permission !== "granted") {
          throw new Error(
            `Notification permission: ${permission}`
          );
        }

        const registration =
          await navigator.serviceWorker.register(
            "/firebase-messaging-sw.js"
          );

        messaging = getMessaging(app);

        const token = await getToken(messaging, {
          vapidKey,
          serviceWorkerRegistration: registration
        });

        tokenOutput.textContent = token;

        status.textContent =
          "Receiver connected. Esteban addressable.";

        connect.textContent =
          "RECEIVER CONNECTED";

        /*
          A message received while this page is visible
          does not need a notification tap.
        */

        onMessage(messaging, (payload) => {
          const text =
            payload.data?.signal ||
            payload.notification?.body ||
            payload.notification?.title ||
            "UNDECIPHERED SIGNAL";

          displaySignal(text);

          status.textContent =
            "Signal received in foreground.";
        });
      } catch (error) {
        console.error(error);
        status.textContent = error.message;
      }
    });
  </script>
</body>
</html>
