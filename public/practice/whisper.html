<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090909">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>WHISPER</title>

  <style>
    * { box-sizing: border-box; }

    :root {
      color-scheme: dark;
      background: #090909;
      color: #e7e2d6;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    body {
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: max(24px, env(safe-area-inset-top))
               max(24px, env(safe-area-inset-right))
               max(24px, env(safe-area-inset-bottom))
               max(24px, env(safe-area-inset-left));
      background: #090909;
    }

    main { width: min(100%, 520px); }

    .receiver {
      position: relative;
      padding: 22px 0 20px;
    }

    .receiver::before,
    .receiver::after {
      content: "";
      position: absolute;
      left: 0;
      width: 34px;
      height: 1px;
      background: #4e4b45;
    }

    .receiver::before { top: 0; }
    .receiver::after { bottom: 0; }

    .identifier,
    .whisperer {
      position: absolute;
      margin: 0;
      color: #76726a;
      font-size: 10px;
      line-height: 1;
      letter-spacing: .18em;
      text-transform: uppercase;
      user-select: none;
    }

    .identifier {
      top: 0;
      right: 0;
    }

    .whisperer {
      right: 0;
      bottom: 0;
      padding-left: 14px;
      animation: whisper-pulse 4.8s ease-in-out infinite;
    }

    .whisperer::before {
      content: "";
      position: absolute;
      top: 50%;
      left: 0;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: currentColor;
      transform: translateY(-50%);
      box-shadow: 0 0 7px currentColor;
    }

    @keyframes whisper-pulse {
      0%, 64%, 100% { opacity: .28; }
      70% { opacity: .72; }
      76% { opacity: .38; }
      82% { opacity: .62; }
    }

    #message {
      min-height: 52svh;
      display: grid;
      place-items: center;
      padding: 28px;
      border: 1px solid #4e4b45;
      color: #f0ebdf;
      font-size: clamp(28px, 10vw, 58px);
      line-height: 1.08;
      text-align: center;
      overflow-wrap: anywhere;
    }

    button {
      width: 100%;
      margin-top: 16px;
      padding: 17px;
      border: 1px solid #e7e2d6;
      border-radius: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      letter-spacing: .12em;
      cursor: pointer;
    }

    button:disabled { opacity: .45; }

    #status {
      min-height: 18px;
      margin: 14px 0 0;
      color: #89857d;
      font-size: 11px;
      line-height: 1.5;
      text-align: center;
    }

    @media (max-width: 380px) {
      .identifier,
      .whisperer {
        font-size: 9px;
        letter-spacing: .13em;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .whisperer {
        animation: none;
        opacity: .5;
      }
    }
  </style>
</head>

<body>
  <main>
    <section class="receiver" aria-label="Whisper receiver">
      <p class="identifier" aria-label="Technodrone root identifier">TECHNODRONE://ROOT</p>
      <div id="message" aria-live="polite"></div>
      <p class="whisperer" aria-hidden="true">WHISPERER</p>
    </section>
    <button id="connect" type="button">CONNECT</button>
    <p id="status">DISCONNECTED</p>
  </main>

  <script type="module">
    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

    import {
      getMessaging,
      getToken,
      isSupported,
      onMessage
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-messaging.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBCD7hYTGcuwd-d9t8eCfwvNcGFbbwbg5A",
      authDomain: "skilseting.firebaseapp.com",
      projectId: "skilseting",
      storageBucket: "skilseting.firebasestorage.app",
      messagingSenderId: "323745949558",
      appId: "1:323745949558:web:bfda4c5b62d79d7dde7c57"
    };

    const vapidKey =
      "BHE1a4Z4oaeGA0h2oU4JKLYwPwcJIK7cOfgGH3wBQCg4UnTRgJq3ellzLZ0DTMns8liEbb7EMhkr-wK-anA-q0o";

    const app = initializeApp(firebaseConfig);
    const button = document.querySelector("#connect");
    const status = document.querySelector("#status");
    const message = document.querySelector("#message");

    let token = "";
    let listenerStarted = false;

    function showSignal(text) {
      message.textContent = text || "";
    }

    const initialSignal =
      new URLSearchParams(location.search).get("signal");

    if (initialSignal) {
      showSignal(initialSignal);
    }

    async function copyKey() {
      await navigator.clipboard.writeText(token);
      status.textContent = "KEY COPIED";
    }

    button.addEventListener("click", async () => {
      if (token) {
        try {
          await copyKey();
        } catch {
          status.textContent = "COPY FAILED — PRESS AND HOLD NOT AVAILABLE";
        }
        return;
      }

      button.disabled = true;
      status.textContent = "CONNECTING";

      try {
        if (!(await isSupported())) {
          throw new Error("INSTALL TO HOME SCREEN FIRST");
        }

        const permission = await Notification.requestPermission();

        if (permission !== "granted") {
          throw new Error("NOTIFICATION PERMISSION REQUIRED");
        }

        const registration = await navigator.serviceWorker.register(
          "/firebase-messaging-sw.js"
        );

        await registration.update();

        const messaging = getMessaging(app);

        token = await getToken(messaging, {
          vapidKey,
          serviceWorkerRegistration: registration
        });

        if (!token) {
          throw new Error("NO KEY RECEIVED");
        }

        if (!listenerStarted) {
          onMessage(messaging, (payload) => {
            showSignal(
              payload.data?.signal ||
              payload.data?.body ||
              payload.notification?.body ||
              ""
            );
            status.textContent = "RECEIVED";
          });

          listenerStarted = true;
        }

        button.textContent = "COPY KEY";
        status.textContent = "CONNECTED";
      } catch (error) {
        status.textContent = error.message || "CONNECTION FAILED";
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
